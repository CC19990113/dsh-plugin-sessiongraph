name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance: mints the OIDC token that lets npm attest
      # this tarball was built from this repo at this commit. Without it the
      # publish still succeeds, but silently drops the provenance badge.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publishing an artifact that does not typecheck or pass its own tests is
      # not recoverable: npm forbids re-using a version number.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The bundle is what users install, so its npm page must render the
      # project README. Copied at publish time rather than committed, so the
      # two can never drift apart.
      - name: Stage bundle README
        run: cp README.md packages/bundle/README.md

      # Publishing is irreversible, so it is skipped when that version already
      # exists. This matters because a release can be created *after* the tarballs
      # went out by hand (`npm publish <tarball>`) — without the guard the workflow
      # would fail with a 409 the day someone edits an old release.
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          version=$(node -p "require('./packages/bundle/package.json').version")
          if npm view "dsh-plugin-sessiongraph-bundle@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-plugin-sessiongraph-bundle@${version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `pnpm -r publish` walks the workspace in dependency order and rewrites
      # every `workspace:^` range into the concrete published version.
      #
      # `packages/native` ships its loader only: the `.node` kernel is a build
      # artifact (gitignored, produced by `build-native.sh`), so a fresh install
      # falls back to the TypeScript indexer until someone builds it locally.
      # That is the documented behaviour, not a missing step.
      #
      # `publishConfig.provenance` stays false for now: npm stages a **new**
      # package's first publish and refuses to unpublish the staged version, so a
      # provenance-bearing first release can leave the version slot unusable.
      # Turn it back on once every package name already exists on the registry.
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
