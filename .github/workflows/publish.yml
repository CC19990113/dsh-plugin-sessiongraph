name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # One kernel per platform, each built on a runner that can produce it. The publish job below names
  # them as optional dependencies, so they must exist on the registry before it installs.
  build-native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          # Intel macOS, cross-compiled on the arm64 runner: `macos-13` is the last Intel image and
          # can sit queued for many minutes, which blocks the whole release.
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the kernel for ${{ matrix.suffix }}
        shell: bash
        working-directory: packages/native
        run: ./build-native.sh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.suffix }}
          path: crates/sessiongraph-core/npm/${{ matrix.suffix }}/*.node
          if-no-files-found: error

  publish:
    needs: build-native
    # ubuntu is fine here: the kernel arrives as a downloaded artifact, not as a build output.
    runs-on: ubuntu-latest
    permissions:
      # Deliberately NOT `id-token: write`. pnpm 11 tries OIDC trusted
      # publishing whenever that permission is granted, the exchange fails on a
      # package without a configured trusted publisher, and the fallback path
      # ends up *staged* — the registry shows 0.0.0-stage and the real version
      # never appears (0.1.0, 0.1.1 and 0.1.2 all hit this). With the permission
      # absent pnpm goes straight to NODE_AUTH_TOKEN and publishes normally.
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Place the kernels into their platform packages
        shell: bash
        run: |
          set -euo pipefail
          # The artifact name carries the `native-` tag it was uploaded under; the package directory
          # does not. Stripping it keeps the two from being confused.
          for dir in native-artifacts/*/; do
            name="$(basename "$dir")"
            suffix="${name#native-}"
            cp "$dir"*.node "crates/sessiongraph-core/npm/$suffix/"
          done
          for pkg in crates/sessiongraph-core/npm/*/; do
            count=$(find "$pkg" -maxdepth 1 -name '*.node' | wc -l)
            echo "$pkg -> $count binary(ies)"
            if [ "$count" -ne 1 ]; then
              echo "::warning::$pkg has no binary and will not be published; that platform falls back to the TypeScript indexer"
            fi
          done

      # Platform packages first: the native package names them as optional dependencies, so a frozen
      # install cannot resolve until they exist. An artifact-less platform is skipped rather than
      # failing the release — npm treats an unpublished optional dependency as "not installed".
      - name: Publish platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          for pkg in crates/sessiongraph-core/npm/*/; do
            if [ "$(find "$pkg" -maxdepth 1 -name '*.node' | wc -l)" -ne 1 ]; then
              echo "skipping $pkg (no binary in this run)"
              continue
            fi
            echo "publishing $pkg"
            if ! npm publish "$pkg" --access public 2>&1 | tee /tmp/pub.log; then
              if grep -qE "previously published|cannot publish over" /tmp/pub.log; then
                echo "$pkg already at this version; continuing"
              else
                exit 1
              fi
            fi
          done

      # Not frozen: the optional platform packages were only just published, so the lockfile this
      # checkout carries predates them. CI does not commit the lockfile.
      # The release publishes its own platform packages, so pnpm's freshness window is not a
      # supply-chain risk here — it is the thing being published. Without this, a run fails on
      # lockfile entries for packages published minutes ago by the *previous* release.
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      # Publishing an artifact that does not typecheck or pass its own tests is
      # not recoverable: npm forbids re-using a version number.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The bundle is what users install, so its npm page must render the
      # project README. Copied at publish time rather than committed, so the
      # two can never drift apart.
      - name: Stage bundle README
        run: cp README.md packages/bundle/README.md

      # Publishing is irreversible, so it is skipped when that version already
      # exists. This matters because a release can be created *after* the tarballs
      # went out by hand (`npm publish <tarball>`) — without the guard the workflow
      # would fail with a 409 the day someone edits an old release.
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          version=$(node -p "require('./packages/bundle/package.json').version")
          if npm view "dsh-plugin-sessiongraph@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-plugin-sessiongraph@${version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `pnpm -r pack` rewrites every `workspace:^` range into the concrete
      # version, and `npm publish` then uploads the tarball.
      #
      # NOT `pnpm publish`: on this runner pnpm 11 reports `Published package
      # x@y` while the registry keeps only a `0.0.0-stage` placeholder — the
      # version never appears and its slot stays taken (0.1.0 through 0.1.3 all
      # hit this). `npm publish <tarball>` is the path that actually lands.
      #
      # `packages/native` ships its loader only: the `.node` kernel is a build
      # artifact (gitignored, produced by `build-native.sh`), so a fresh install
      # falls back to the TypeScript indexer until someone builds it locally.
      # That is the documented behaviour, not a missing step.
      - name: Pack
        run: pnpm -r pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: |
          set -euo pipefail
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            case "$tarball" in
              *-root-*) echo "skip workspace root: $tarball"; continue ;;
            esac
            npm publish "$tarball" --access public --provenance=false
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
