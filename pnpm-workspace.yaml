packages:
  - 'packages/*'
# 发版窗口期的临时豁免：pnpm 11 的 minimumReleaseAge（1440 分钟）会把刚发布的平台包
# 判为「太新」，连 lockfile 校验阶段都拒收。这里只写包名（不带版本）—— 实测带版本的
# 形式对 lockfile 校验不生效，而 release-prepare.mjs 写的就是带版本的。等 24 小时窗口
# 过去后可以把这几行去掉。
minimumReleaseAgeExclude:
  - dsh-plugin-sessiongraph-indexer-darwin-arm64
  - dsh-plugin-sessiongraph-indexer-darwin-x64
  - dsh-plugin-sessiongraph-indexer-linux-arm64-gnu
  - dsh-plugin-sessiongraph-indexer-linux-x64-gnu
  - dsh-plugin-sessiongraph-indexer-win32-x64-msvc
